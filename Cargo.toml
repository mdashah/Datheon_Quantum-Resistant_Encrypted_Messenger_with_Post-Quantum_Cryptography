[package]
name = "pqc_messenger"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
name = "pqc_messenger"

[[bin]]
name = "server"
path = "src/server.rs"

[dependencies]
pqc_kyber = "0.7.1"
hex = "0.4"
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = { version = "0.8", features = ["getrandom"] }

# Native dependencies (used by the server)
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"

# WASM-only dependencies (used by the browser)
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
pqc_kyber = { version = "0.7.1", features = ["wasm"] }
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = "s"
lto = true
